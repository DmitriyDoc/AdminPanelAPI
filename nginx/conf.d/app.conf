server {
    listen 80;
    server_name spectrum.local;
    client_max_body_size 100M;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    location /socket.io/ {
            proxy_pass http://spectrum_socket:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass spectrum_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_REQUESTED_WITH "XMLHttpRequest";
        fastcgi_param HTTP_X_XSRF_TOKEN $http_x_xsrf_token;
        fastcgi_param HTTP_ORIGIN $http_origin;
    }

    # Проксирование изображений TMDB через wsrv.nl (с корректным HTTPS handshake)
    location ~ ^/tmdb_img/(.*)$ {
        set $target_url "https://image.tmdb.org/$1";

        # Передаем запрос на wsrv.nl
        proxy_pass https://wsrv.nl/?url=$target_url;

        # Обязательные заголовки
        proxy_set_header Host wsrv.nl;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

        # === КРИТИЧЕСКИ ВАЖНО для HTTPS upstream ===
        proxy_ssl_server_name on;       # Включаем передачу SNI (имени домена) при SSL-рукопожатии
        proxy_ssl_name wsrv.nl;         # Явно указываем имя сервера для SSL
        proxy_ssl_verify off;           # Отключаем строгую проверку сертификата (избегаем проблем с CA в Alpine)

        # === НАСТРОЙКИ "БЕЗ МУСОРА" ===
        proxy_cache off;
        proxy_max_temp_file_size 0;     # Только RAM, без записи на диск
        proxy_buffering on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        add_header Access-Control-Allow-Origin "*";
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
