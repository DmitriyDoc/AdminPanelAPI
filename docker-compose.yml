version: '3'
services:
    # PHP Service (админка Spectrum)
    spectrum_php:
        container_name: spectrum_php
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        tty: true
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./.env:/var/www/.env
            - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - shared-media-network
        extra_hosts:
            #- "xray-host:172.18.0.1"
            - "spectrum.local:host-gateway"
            - "media-api.local:host-gateway"
            - "kinospectr.local:host-gateway"
        environment:
            - NO_PROXY=localhost,127.0.0.1,spectrum.local,media-api.local,kinospectr.local,spectrum_db,spectrum_redis,spectrum_playwright_parser,spectrum_chromium_bridge,spectrum_chromium,.amazon.com,m.media-amazon.com,translate.google.com
    # Nginx Service
    spectrum_webserver:
        container_name: spectrum_webserver
        image: nginx:alpine
        restart: unless-stopped
        tty: true
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./nginx/conf.d/:/etc/nginx/conf.d/
        networks:
            - shared-media-network

    # MySQL Service
    spectrum_db:
        container_name: spectrum_db
        image: mysql:5.7.22
        restart: unless-stopped
        tty: true
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - dbdata:/var/lib/mysql/
            - ./mysql/my.cnf:/etc/mysql/my.cnf
        networks:
            - shared-media-network

    # Redis Service
    spectrum_redis:
        container_name: spectrum_redis
        image: redis:latest
        ports:
            - "6379:6379"
        volumes:
            - ./redisdata:/data
        command: ["redis-server", "--bind", "spectrum_redis", "--port", "6379","--stop-writes-on-bgsave-error", "no"]
        networks:
            - shared-media-network

    # Adminer client
    spectrum_adminer:
        container_name: spectrum_adminer
        restart: unless-stopped
        image: adminer:4
        environment:
            ADMINER_DEFAULT_DB_DRIVER: mysql
            ADMINER_DEFAULT_DB_HOST: spectrum_db
            ADMINER_DEFAULT_DB_NAME: ${DB_DATABASE}
        depends_on:
            - spectrum_db
        ports:
            - "${ADMINER_PORT:-8080}:8080"
        networks:
            - shared-media-network

    # Composer
    spectrum_composer:
        container_name: spectrum_composer
        image: composer:latest
        tty: true
        volumes:
            - ./:/var/www
        working_dir: /var/www
        depends_on:
            - spectrum_php
        networks:
            - shared-media-network

    # NPM
    spectrum_npm:
        container_name: spectrum_npm
        build:
            context: .
            dockerfile: Dockerfile.node
        tty: true
        ports:
            - "5173:5173"
        volumes:
            - ./:/var/www
        working_dir: /var/www
        command: ["npm", "run", "dev", "--", "--host"]
        networks:
            - shared-media-network

    # SOCKET
    spectrum_socket:
        container_name: spectrum_socket
        build:
            context: .
            dockerfile: Dockerfile.node
        tty: true
        volumes:
            - ./:/var/www
            - /var/www/node_modules
        working_dir: /var/www
        command: [ "node", "server.js" ]
        networks:
            - shared-media-network
        depends_on:
            - spectrum_redis
            - spectrum_db

    # PLAYWRIGHT PARSER
    spectrum_playwright_parser:
        build:
            context: .
            dockerfile: Dockerfile.parser
        container_name: spectrum_playwright_parser
        restart: unless-stopped
        ports:
            - "3001:3001"
        volumes:
            - ./playwright-parser.js:/app/playwright-parser.js
            - ./imdb_cookies.json:/app/imdb_cookies.json
        networks:
            - shared-media-network
        environment:
            - HTTP_PROXY=http://77.73.134.181:8000
            - HTTPS_PROXY=http://77.73.134.181:8000
            - NO_PROXY=localhost,127.0.0.1,spectrum.local,media-api.local,kinospectr.local,spectrum_db,spectrum_redis
        extra_hosts:
            - "spectrum.local:host-gateway"
            - "media-api.local:host-gateway"
            - "kinospectr.local:host-gateway"
    # BROWSERLESS CHROME
    spectrum_chromium:
        container_name: spectrum_chromium
        image: browserless/chrome:latest
        restart: unless-stopped
        cap_add:
            - SYS_ADMIN
        security_opt:
            - seccomp:unconfined
        shm_size: 2g
        environment:
            ENABLE_DEBUGGER: "false"
            MAX_CONCURRENT_SESSIONS: "10"
            PREBOOT_CHROME: "false"
            CONNECTION_TIMEOUT: "-1"
            DEFAULT_LAUNCH_ARGS: '["--proxy-server=http://194.32.251.41:8000", "--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"]'
        networks:
            - shared-media-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "spectrum.local:host-gateway"
        healthcheck:
            test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/json/version" ]
            interval: 30s
            timeout: 10s
            retries: 3
    # BRIDGE API
    spectrum_chromium_bridge:
        build:
            context: .
            dockerfile: Dockerfile.chromium_bridge
        container_name: spectrum_chromium_bridge
        restart: unless-stopped
        ports:
            - "9224:3002"
        environment:
            - BROWSERLESS_WS_URL=ws://spectrum_chromium:3000
            - MAX_CONCURRENCY=5
            - REQUEST_TIMEOUT=25000
        depends_on:
            - spectrum_chromium
        networks:
            - shared-media-network

    # Queue Worker Service
    spectrum_worker:
        container_name: spectrum_worker
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        tty: true
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./.env:/var/www/.env
        command: [ "php", "artisan", "queue:work", "database", "--queue=parsing_movie,parsing_celeb", "--sleep=10", "--tries=2", "--timeout=600", "--max-jobs=1", "--rest=10" ]
        networks:
            - shared-media-network
        depends_on:
            - spectrum_db
            - spectrum_redis
        extra_hosts:
            - "spectrum.local:host-gateway"
            - "media-api.local:host-gateway"
            - "kinospectr.local:host-gateway"
        environment:
            - NO_PROXY=localhost,127.0.0.1,spectrum.local,media-api.local,kinospectr.local,spectrum_db,spectrum_redis,spectrum_playwright_parser,spectrum_chromium_bridge,spectrum_chromium,.amazon.com,m.media-amazon.com,translate.google.com
networks:
    shared-media-network:
        external: true

volumes:
    dbdata:
        driver: local
